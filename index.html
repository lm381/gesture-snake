<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 手势贪吃蛇</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background-color: #080c16; display: flex; justify-content: center; align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    #game-container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background: #080c16; overflow: hidden;
    }
    #webcam {
      position: absolute; top: 0; left: 0; width: 1px; height: 1px;
      opacity: 0.01; pointer-events: none;
    }
    #output_canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: cover;
    }

    .hud-panel {
      position: absolute; top: 16px; z-index: 20;
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px); border-radius: 12px; color: #fff;
      padding: 8px 16px; display: flex; flex-direction: column; gap: 4px; pointer-events: none;
    }
    #score-hud { left: 16px; }
    .score-main { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    #score-val { color: #22c55e; font-size: 24px; font-weight: 800; }
    .highscore-sub { font-size: 12px; color: #fbbf24; }
    
    #status-hud {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 20; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px; padding: 6px 18px; color: #38bdf8; font-size: 13px; font-weight: 600;
      pointer-events: none; white-space: nowrap; transition: color 0.2s;
    }

    .ctrl-group {
      position: absolute; bottom: 16px; left: 16px; z-index: 25;
      display: flex; gap: 8px;
    }
    .ctrl-btn {
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px;
      font-weight: 600; cursor: pointer;
    }

    #start-overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.92);
      z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 24px; text-align: center; gap: 16px; color: #fff;
    }
    .start-btn {
      background: #22c55e; color: #fff; border: none; font-size: 18px; font-weight: 700;
      padding: 14px 36px; border-radius: 14px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
      -webkit-tap-highlight-color: transparent;
    }
    .start-btn:active { transform: scale(0.97); }

    #gameover-screen {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85);
      z-index: 60; display: none; flex-direction: column; justify-content: center; align-items: center;
    }
    .go-card {
      background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 20px; padding: 32px 40px; display: flex; flex-direction: column;
      align-items: center; gap: 14px; color: #fff;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <video id="webcam" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="output_canvas"></canvas>

    <div id="score-hud" class="hud-panel">
      <div class="score-main">🍎 分数: <span id="score-val">0</span></div>
      <div class="highscore-sub">★ 历史最高: <span id="highscore-val">0</span></div>
    </div>

    <div id="status-hud">待启动</div>

    <div class="ctrl-group">
      <button class="ctrl-btn" id="btn-restart">🔄 重置</button>
      <button id="toggle-mode-btn" class="ctrl-btn">切换: 鼠标/触屏</button>
    </div>

    <div id="start-overlay">
      <h2 style="font-size: 26px;">🐍 AI 手势贪吃蛇</h2>
      <p id="tip-text" style="color: #94a3b8; font-size: 14px; max-width: 320px; line-height: 1.6;">
        游戏支持<b>前置摄像头手势</b>与<b>屏幕触屏/鼠标滑动</b>。<br>点击下方绿色按钮即可开始！
      </p>
      <button id="real-start-btn" class="start-btn">📸 启动摄像头开始游戏</button>
      <button id="touch-mode-btn" class="ctrl-btn" style="margin-top: 10px; opacity: 0.9;">直接触屏/鼠标游玩</button>
    </div>

    <div id="gameover-screen">
      <div class="go-card">
        <h2 style="color: #ef4444; font-size: 28px;">游戏结束</h2>
        <p style="color: #94a3b8; font-size: 14px;">蛇头碰到了自身！</p>
        <div style="font-size: 16px; margin: 4px 0;">
          得分: <b id="final-score" style="color: #4ade80;">0</b> | 
          最高: <b id="final-highscore" style="color: #fbbf24;">0</b>
        </div>
        <button class="start-btn" id="btn-re-play">再玩一次</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('webcam');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('real-start-btn');
    const tipText = document.getElementById('tip-text');
    const statusHud = document.getElementById('status-hud');
    const toggleBtn = document.getElementById('toggle-mode-btn');

    let score = 0;
    let highscore = parseInt(localStorage.getItem('gesture_snake_highscore') || '0', 10);
    document.getElementById('highscore-val').innerText = highscore;

    let isGameOver = false;
    let isTouchMode = false;
    let targetPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let handPoints = null;

    const SEG_DIST = 14;
    let snake = [];
    let length = 25;
    let apple = { x: 0, y: 0, r: 16, pulse: 0 };
    let safeFrames = 60;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (!apple.x && !apple.y) spawnApple();
    }
    window.addEventListener('resize', resize);
    resize();

    function initSnake() {
      snake = [];
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      targetPos = { x: cx, y: cy };
      for (let i = 0; i < length; i++) {
        snake.push({ x: cx, y: cy + i * 2 });
      }
    }
    initSnake();

    function spawnApple() {
      const pad = 60;
      apple.x = pad + Math.random() * (canvas.width - pad * 2);
      apple.y = pad + Math.random() * (canvas.height - pad * 2);
    }

    function triggerGameOver() {
      if (isGameOver) return;
      isGameOver = true;
      if (score > highscore) {
        highscore = score;
        localStorage.setItem('gesture_snake_highscore', highscore);
        document.getElementById('highscore-val').innerText = highscore;
      }
      document.getElementById('final-score').innerText = score;
      document.getElementById('final-highscore').innerText = highscore;
      document.getElementById('gameover-screen').style.display = 'flex';
    }

    function restartGame() {
      score = 0;
      document.getElementById('score-val').innerText = 0;
      length = 25;
      isGameOver = false;
      safeFrames = 60;
      document.getElementById('gameover-screen').style.display = 'none';
      initSnake();
      spawnApple();
    }
    document.getElementById('btn-restart').onclick = restartGame;
    document.getElementById('btn-re-play').onclick = restartGame;

    function updateTouch(clientX, clientY) {
      targetPos.x = clientX;
      targetPos.y = clientY;
    }
    window.addEventListener('mousemove', (e) => {
      if (isTouchMode || !video.srcObject) updateTouch(e.clientX, e.clientY);
    });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) updateTouch(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) updateTouch(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    document.getElementById('touch-mode-btn').onclick = function() {
      isTouchMode = true;
      startOverlay.style.display = 'none';
      statusHud.innerText = '👆 触屏/鼠标模式已开启';
      statusHud.style.color = '#4ade80';
      toggleBtn.innerText = '模式: 触屏操控';
    };

    toggleBtn.onclick = function() {
      isTouchMode = !isTouchMode;
      toggleBtn.innerText = isTouchMode ? '模式: 触屏操控' : '模式: 手势控制';
      statusHud.innerText = isTouchMode ? '👆 触屏/鼠标模式' : '🔍 寻找手掌中...';
    };

    function updatePhysics() {
      if (isGameOver || snake.length === 0) return;

      snake[0].x += (targetPos.x - snake[0].x) * 0.35;
      snake[0].y += (targetPos.y - snake[0].y) * 0.35;

      for (let i = 1; i < snake.length; i++) {
        const p = snake[i - 1], c = snake[i];
        const dx = p.x - c.x, dy = p.y - c.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0.001) {
          c.x += dx * ((dist - SEG_DIST) / dist);
          c.y += dy * ((dist - SEG_DIST) / dist);
        }
      }

      while (snake.length < length) {
        const tail = snake[snake.length - 1];
        snake.push({ x: tail.x, y: tail.y });
      }

      if (safeFrames > 0) {
        safeFrames--;
      } else if (snake.length > 25) {
        for (let i = 16; i < snake.length; i++) {
          if (Math.hypot(snake[0].x - snake[i].x, snake[0].y - snake[i].y) < 14) {
            triggerGameOver();
            return;
          }
        }
      }

      if (Math.hypot(snake[0].x - apple.x, snake[0].y - apple.y) < apple.r + 20) {
        score++;
        document.getElementById('score-val').innerText = score;
        length += 4;
        spawnApple();
      }
    }

    function render() {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      if (video.readyState >= 2 && !isTouchMode) {
        ctx.save();
        ctx.scale(-1, 1);
        ctx.drawImage(video, -w, 0, w, h);
        ctx.restore();
      } else {
        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, w, h);
      }

      updatePhysics();

      // 绘制捕获到的手部关节点
      if (handPoints && !isTouchMode) {
        ctx.save();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.85)';
        for (let i = 0; i < handPoints.length; i++) {
          const pt = handPoints[i];
          ctx.beginPath();
          ctx.arc((1 - pt.x) * w, pt.y * h, 5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(targetPos.x, targetPos.y, 22, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // 苹果
      if (!isGameOver) {
        apple.pulse += 0.08;
        const pr = apple.r + Math.sin(apple.pulse) * 3;
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ef4444';
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(apple.x, apple.y, pr, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 贪吃蛇
      if (snake.length > 1) {
        for (let i = snake.length - 1; i >= 0; i--) {
          const s = snake[i];
          const t = i / snake.length;
          const rad = 16 * (1 - t * 0.45);
          ctx.save();
          ctx.fillStyle = `rgb(${Math.round(34 + t * 40)}, ${Math.round(197 - t * 50)}, ${Math.round(94 + t * 40)})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, rad, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(snake[0].x - 5, snake[0].y - 5, 4, 0, Math.PI * 2);
        ctx.arc(snake[0].x + 5, snake[0].y - 5, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(snake[0].x - 5, snake[0].y - 5, 2, 0, Math.PI * 2);
        ctx.arc(snake[0].x + 5, snake[0].y - 5, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url;
        s.crossOrigin = 'anonymous';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    startBtn.onclick = async function() {
      startBtn.innerText = '正在调起摄像头...';
      tipText.innerHTML = '⚡ 请点击浏览器弹窗中的<b>“允许”</b>！';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        startOverlay.style.display = 'none';
        statusHud.innerText = '⏳ 正在加载手势模型(若超时将自动转触控)...';

        // 5秒超时保底机制：避免外网模型加载挂起无限卡住
        const timeoutGuard = setTimeout(() => {
          if (!window.handsReady) {
            console.warn('AI模型加载超时，转为触控模式');
            isTouchMode = true;
            statusHud.innerText = '⚠️ 手势网络受限，已自动切换为触控/鼠标模式';
            statusHud.style.color = '#fbbf24';
            toggleBtn.innerText = '模式: 触屏操控';
          }
        }, 6000);

        try {
          // 换用国内同步最完整的 unpkg 镜像与 jsdelivr 镜像组合
          await loadScript('https://lib.baomitu.com/mediapipe-camera-utils/0.4.1675466862/camera_utils.js').catch(() => 
            loadScript('https://unpkg.com/@mediapipe/camera_utils@0.4.1675466862/camera_utils.js')
          );
          await loadScript('https://lib.baomitu.com/mediapipe-hands/0.4.1675469240/hands.js').catch(() => 
            loadScript('https://unpkg.com/@mediapipe/hands@0.4.1675469240/hands.js')
          );

          const hands = new Hands({
            locateFile: (file) => `https://unpkg.com/@mediapipe/hands@0.4.1675469240/${file}`
          });

          hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0, // 移动端/低算力更敏感
            minDetectionConfidence: 0.2, // 极限降低置信度阈值，哪怕微弱手影也能直接捕捉
            minTrackingConfidence: 0.2
          });

          hands.onResults((results) => {
            window.handsReady = true;
            clearTimeout(timeoutGuard);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
              const lm = results.multiHandLandmarks[0];
              handPoints = lm;

              // 优先食指(8)，备选中指(12)，再备选掌心(9)
              const finger = lm[8] || lm[12] || lm[9];
              targetPos.x = (1 - finger.x) * canvas.width;
              targetPos.y = finger.y * canvas.height;

              statusHud.innerText = '🎯 识别成功！正在手势操控';
              statusHud.style.color = '#4ade80';
            } else {
              handPoints = null;
              statusHud.innerText = '🔍 寻找手掌中（请将手掌展开，距离镜头40-60cm）';
              statusHud.style.color = '#f59e0b';
            }
          });

          // 启动逐帧检测
          const camera = new Camera(video, {
            onFrame: async () => {
              if (!isTouchMode && video.readyState >= 2) {
                await hands.send({ image: video });
              }
            },
            width: 640,
            height: 480
          });
          camera.start();

        } catch (e) {
          console.warn('AI加载失败', e);
          isTouchMode = true;
          statusHud.innerText = '触控/鼠标模式已开启';
          statusHud.style.color = '#4ade80';
        }

      } catch (err) {
        alert('无法启动相机：' + err.message);
        startOverlay.style.display = 'none';
        isTouchMode = true;
        statusHud.innerText = '触控/鼠标模式';
      }
    };
  </script>
</body>
</html>
