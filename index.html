<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 手势贪吃蛇</title>

  <!-- 全面切换至无墙国内极速镜像源 -->
  <script src="https://registry.npmmirror.com/@mediapipe/camera_utils/0.4.1675466862/files/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://registry.npmmirror.com/@mediapipe/hands/0.4.1675469240/files/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background-color: #080c16; display: flex; justify-content: center; align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    #game-container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background: #000; overflow: hidden;
    }
    #webcam {
      position: absolute; top: 0; left: 0; width: 1px; height: 1px;
      opacity: 0.01; pointer-events: none;
    }
    #output_canvas {
      width: 100%; height: 100%; object-fit: cover;
    }
    .hud-panel {
      position: absolute; top: 16px; z-index: 20;
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px); border-radius: 12px; color: #fff;
      padding: 8px 16px; display: flex; flex-direction: column; gap: 4px; pointer-events: none;
    }
    #score-hud { left: 16px; }
    .score-main { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    #score-val { color: #22c55e; font-size: 24px; font-weight: 800; }
    .highscore-sub { font-size: 12px; color: #fbbf24; }
    #color-hud { right: 16px; display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .color-dot { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
    .color-text { font-size: 14px; font-weight: 600; }

    .ctrl-group {
      position: absolute; bottom: 16px; left: 16px; z-index: 25;
      display: flex; gap: 8px;
    }
    .ctrl-btn {
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px;
      font-weight: 600; cursor: pointer;
    }

    #start-overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
      z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 24px; text-align: center; gap: 16px; color: #fff;
    }
    .start-btn {
      background: #22c55e; color: #fff; border: none; font-size: 18px; font-weight: 700;
      padding: 14px 36px; border-radius: 14px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
    }
    .start-btn:active { transform: scale(0.97); }

    #gameover-screen {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85);
      z-index: 60; display: none; flex-direction: column; justify-content: center; align-items: center;
    }
    .go-card {
      background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 20px; padding: 32px 40px; display: flex; flex-direction: column;
      align-items: center; gap: 14px; color: #fff;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <video id="webcam" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="output_canvas"></canvas>

    <div id="score-hud" class="hud-panel">
      <div class="score-main">🍎 分数: <span id="score-val">0</span></div>
      <div class="highscore-sub">★ 历史最高: <span id="highscore-val">0</span></div>
    </div>

    <div id="color-hud" class="hud-panel">
      <div id="color-dot" class="color-dot" style="background:#22c55e; color:#22c55e;"></div>
      <div id="color-text" class="color-text" style="color:#22c55e;">翠绿</div>
    </div>

    <div class="ctrl-group">
      <button class="ctrl-btn" id="btn-restart">🔄 重置</button>
      <button id="toggle-mode-btn" class="ctrl-btn">模式: 手势控制</button>
    </div>

    <div id="start-overlay">
      <h2 style="font-size: 26px;">🐍 AI 手势贪吃蛇</h2>
      <p id="tip-text" style="color: #94a3b8; font-size: 14px; max-width: 320px; line-height: 1.6;">
        游戏需要使用前置摄像头识别手指。<br>点击下方按钮后，请在弹窗中允许权限。
      </p>
      <button id="real-start-btn" class="start-btn">📸 启动摄像头开始游戏</button>
      <button id="mouse-mode-btn" class="ctrl-btn" style="margin-top: 10px; opacity: 0.8;">不使用摄像头，触屏/鼠标游玩</button>
    </div>

    <div id="gameover-screen">
      <div class="go-card">
        <h2 style="color: #ef4444; font-size: 28px;">游戏结束</h2>
        <p style="color: #94a3b8; font-size: 14px;">蛇头碰到了自身！</p>
        <div style="font-size: 16px; margin: 4px 0;">
          得分: <b id="final-score" style="color: #4ade80;">0</b> | 
          最高: <b id="final-highscore" style="color: #fbbf24;">0</b>
        </div>
        <button class="start-btn" id="btn-re-play">再玩一次</button>
      </div>
    </div>
  </div>

  <script>
    const RAINBOW = [
      { name: '赤红', hex: '#ef4444', r: 239, g: 68, b: 68 },
      { name: '耀橙', hex: '#f97316', r: 249, g: 115, b: 22 },
      { name: '明黄', hex: '#eab308', r: 234, g: 179, b: 8 },
      { name: '翠绿', hex: '#22c55e', r: 34, g: 197, b: 94 },
      { name: '青碧', hex: '#06b6d4', r: 6, g: 182, b: 212 },
      { name: '湛蓝', hex: '#3b82f6', r: 59, g: 130, b: 246 },
      { name: '幻紫', hex: '#a855f7', r: 168, g: 85, b: 247 }
    ];

    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('webcam');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('real-start-btn');
    const tipText = document.getElementById('tip-text');
    const toggleBtn = document.getElementById('toggle-mode-btn');

    let score = 0;
    let highscore = parseInt(localStorage.getItem('gesture_snake_highscore') || '0', 10);
    document.getElementById('highscore-val').innerText = highscore;

    let isGameOver = false;
    let isMouseMode = false;
    let pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let fingerTarget = null;
    let hands = null;

    const SEG_DIST = 12;
    let snake = [];
    let length = 25;
    let colorIdx = 3;
    let curCol = { ...RAINBOW[colorIdx] };
    let tarCol = { ...RAINBOW[colorIdx] };
    let apple = { x: 0, y: 0, r: 16, pulse: 0 };
    let safeFrames = 60;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (!apple.x && !apple.y) spawnApple();
    }
    window.addEventListener('resize', resize);
    resize();

    function spawnApple() {
      const pad = 60;
      apple.x = pad + Math.random() * (canvas.width - pad * 2);
      apple.y = pad + Math.random() * (canvas.height - pad * 2);
    }

    function triggerGameOver() {
      if (isGameOver) return;
      isGameOver = true;
      if (score > highscore) {
        highscore = score;
        localStorage.setItem('gesture_snake_highscore', highscore);
        document.getElementById('highscore-val').innerText = highscore;
      }
      document.getElementById('final-score').innerText = score;
      document.getElementById('final-highscore').innerText = highscore;
      document.getElementById('gameover-screen').style.display = 'flex';
    }

    function restartGame() {
      score = 0;
      document.getElementById('score-val').innerText = 0;
      length = 25;
      snake = [];
      isGameOver = false;
      safeFrames = 60;
      document.getElementById('gameover-screen').style.display = 'none';
      spawnApple();
    }
    document.getElementById('btn-restart').onclick = restartGame;
    document.getElementById('btn-re-play').onclick = restartGame;

    toggleBtn.onclick = function() {
      isMouseMode = !isMouseMode;
      toggleBtn.innerText = isMouseMode ? '模式: 触屏/鼠标' : '模式: 手势控制';
    };

    document.getElementById('mouse-mode-btn').onclick = function() {
      isMouseMode = true;
      toggleBtn.innerText = '模式: 触屏/鼠标';
      startOverlay.style.display = 'none';
    };

    window.addEventListener('mousemove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) { 
        pointer.x = e.touches[0].clientX; 
        pointer.y = e.touches[0].clientY; 
      }
    }, { passive: true });

    function updatePhysics(targetX, targetY) {
      if (isGameOver) return;
      if (snake.length === 0) {
        for (let i = 0; i < length; i++) snake.push({ x: targetX, y: targetY });
        return;
      }

      snake[0].x += (targetX - snake[0].x) * 0.45;
      snake[0].y += (targetY - snake[0].y) * 0.45;

      for (let i = 1; i < snake.length; i++) {
        const p = snake[i - 1], c = snake[i];
        const dx = p.x - c.x, dy = p.y - c.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0.001) {
          c.x += dx * ((dist - SEG_DIST) / dist);
          c.y += dy * ((dist - SEG_DIST) / dist);
        }
      }

      while (snake.length < length) {
        const tail = snake[snake.length - 1];
        snake.push({ x: tail.x, y: tail.y });
      }

      if (safeFrames > 0) {
        safeFrames--;
      } else if (snake.length > 25) {
        for (let i = 16; i < snake.length; i++) {
          if (Math.hypot(snake[0].x - snake[i].x, snake[0].y - snake[i].y) < 13) {
            triggerGameOver();
            return;
          }
        }
      }

      if (Math.hypot(targetX - apple.x, targetY - apple.y) < apple.r + 20) {
        score++;
        document.getElementById('score-val').innerText = score;
        length += 5;
        colorIdx = (colorIdx + 1) % RAINBOW.length;
        tarCol = { ...RAINBOW[colorIdx] };
        document.getElementById('color-dot').style.background = RAINBOW[colorIdx].hex;
        document.getElementById('color-dot').style.color = RAINBOW[colorIdx].hex;
        document.getElementById('color-text').innerText = RAINBOW[colorIdx].name;
        document.getElementById('color-text').style.color = RAINBOW[colorIdx].hex;
        spawnApple();
      }
    }

    function render(camImg, target) {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      if (camImg && !isMouseMode) {
        ctx.save();
        ctx.scale(-1, 1);
        ctx.drawImage(camImg, -w, 0, w, h);
        ctx.restore();
      } else {
        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, w, h);
      }

      curCol.r += (tarCol.r - curCol.r) * 0.08;
      curCol.g += (tarCol.g - curCol.g) * 0.08;
      curCol.b += (tarCol.b - curCol.b) * 0.08;

      if (target) updatePhysics(target.x, target.y);

      // 食指追踪准星视觉提示（确认当前是否捕获到手指）
      if (fingerTarget && !isMouseMode) {
        ctx.save();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(fingerTarget.x, fingerTarget.y, 18, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(fingerTarget.x, fingerTarget.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      if (!isGameOver) {
        apple.pulse += 0.08;
        const pr = apple.r + Math.sin(apple.pulse) * 3;
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ef4444';
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(apple.x, apple.y, pr, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      if (snake.length > 1) {
        const r = Math.round(curCol.r), g = Math.round(curCol.g), b = Math.round(curCol.b);
        for (let i = snake.length - 1; i >= 0; i--) {
          const s = snake[i];
          const t = i / snake.length;
          const rad = 16 * (1 - t * 0.5);
          ctx.save();
          ctx.fillStyle = `rgb(${Math.min(255, Math.round(r * (1 - t * 0.25)))}, ${Math.min(255, Math.round(g * (1 - t * 0.25)))}, ${Math.min(255, Math.round(b * (1 - t * 0.25)))})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, rad, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(snake[0].x - 4, snake[0].y - 4, 3.5, 0, Math.PI * 2);
        ctx.arc(snake[0].x + 4, snake[0].y - 4, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function loop() {
      const activeTarget = isMouseMode ? pointer : (fingerTarget || pointer);
      render(video.readyState >= 2 ? video : null, activeTarget);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    startBtn.addEventListener('click', async function() {
      tipText.innerHTML = '⚡ 正在请求相机权限...';
      startBtn.innerText = '正在调起摄像头...';

      try {
        // 手机端限制采集分辨率为 480p/640p，避免手机发热降频和算力崩溃
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: 'user', 
            width: { ideal: 640 }, 
            height: { ideal: 480 } 
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        tipText.innerHTML = '✅ 相机已连接，正在载入 AI 追踪模型(约2-3秒)...';

        if (typeof Hands !== 'undefined') {
          hands = new Hands({
            // 关键：强制让 wasm、tflite 等底层权重全部走国内 npmmirror 镜像源
            locateFile: (file) => `https://registry.npmmirror.com/@mediapipe/hands/0.4.1675469240/files/${file}`
          });

          hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0, // 移动端选用极速轻量模型
            minDetectionConfidence: 0.35, // 适当放宽识别阈值，提升移动端弱光/小手识别率
            minTrackingConfidence: 0.35
          });

          hands.onResults((res) => {
            startOverlay.style.display = 'none';
            if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
              const p = res.multiHandLandmarks[0][8]; // 食指指尖坐标
              fingerTarget = { x: (1 - p.x) * canvas.width, y: p.y * canvas.height };
            } else {
              fingerTarget = null;
            }
          });

          let isProcessing = false;
          async function detect() {
            if (!isMouseMode && video.readyState >= 2 && !isProcessing) {
              isProcessing = true;
              try { 
                await hands.send({ image: video }); 
              } catch (e) {}
              isProcessing = false;
            }
            requestAnimationFrame(detect);
          }
          requestAnimationFrame(detect);
        } else {
          startOverlay.style.display = 'none';
        }

      } catch (err) {
        alert('无法启动相机：' + err.name + ' - ' + err.message + '\n请检查手机系统设置或浏览器设置中的相机权限！');
        tipText.innerHTML = `<span style="color:#ef4444;">错误: ${err.message}</span>`;
        startBtn.innerText = '📸 启动摄像头开始游戏';
      }
    });
  </script>
</body>
</html>
