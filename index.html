<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 手势贪吃蛇</title>

  <!-- 使用稳定 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #080c16; display: flex; justify-content: center; align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    #game-container { position: relative; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
    
    /* video 元素隐藏，作为数据源 */
    #webcam { display: none; }
    
    /* 镜像翻转画面，符合镜面交互习惯 */
    #output_canvas {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    
    .hud-panel {
      position: absolute; top: 16px; z-index: 20;
      background: rgba(15, 23, 42, 0.82); border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px); border-radius: 14px; color: #fff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); padding: 10px 18px;
    }
    #score-hud { left: 16px; }
    .score-main { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    #score-val { color: #22c55e; font-size: 26px; font-weight: 800; }
    .highscore-sub { font-size: 12px; color: #fbbf24; margin-top: 3px; }
    
    #color-hud { right: 16px; display: flex; align-items: center; gap: 8px; }
    .color-dot { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
    .color-text { font-size: 14px; font-weight: 600; }
    
    .ctrl-group { position: absolute; bottom: 16px; left: 16px; z-index: 20; display: flex; gap: 8px; }
    .ctrl-btn {
      background: rgba(15, 23, 42, 0.82); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px;
      cursor: pointer; transition: all 0.2s;
    }
    
    #status-overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.92);
      z-index: 30; display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 24px; text-align: center; gap: 14px; color: #fff;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #22c55e; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    #gameover-screen {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.88);
      z-index: 50; display: none; flex-direction: column; justify-content: center; align-items: center;
    }
    .go-card {
      background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 20px; padding: 30px 40px; text-align: center; display: flex; flex-direction: column; gap: 14px;
    }
    .restart-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; font-size: 16px;
      font-weight: 700; border: none; padding: 12px 28px; border-radius: 12px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <video id="webcam" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="output_canvas"></canvas>

    <div id="score-hud" class="hud-panel">
      <div class="score-main">🍎 分数: <span id="score-val">0</span></div>
      <div class="highscore-sub">★ 历史最高: <span id="highscore-val">0</span></div>
    </div>

    <div id="color-hud" class="hud-panel">
      <div id="color-dot" class="color-dot" style="background:#22c55e; color:#22c55e;"></div>
      <div id="color-text" class="color-text" style="color:#22c55e;">翠绿</div>
    </div>

    <div class="ctrl-group">
      <button id="toggle-mouse-btn" class="ctrl-btn">切换控制模式</button>
      <button id="reset-btn" class="ctrl-btn">🔄 重来</button>
    </div>

    <div id="status-overlay">
      <div class="spinner"></div>
      <div id="status-text" style="font-size: 16px; line-height: 1.6;">
        正在请求摄像头并加载手势模型...<br>
        <span style="font-size:12px; color:#94a3b8;">⚠️ 必须通过 HTTPS 访问才能正常开启摄像头</span>
      </div>
      <button id="quick-mouse-btn" class="ctrl-btn" style="margin-top: 10px;">如果未授权，点此使用触控/鼠标玩</button>
    </div>

    <div id="gameover-screen">
      <div class="go-card">
        <h2 style="color: #ef4444; font-size: 28px;">游戏结束</h2>
        <p style="color: #94a3b8; font-size: 14px;">蛇头碰到了自己的身体！</p>
        <div style="font-size: 18px; color: #fff;">
          本次得分: <b id="final-score" style="color: #4ade80;">0</b> | 
          历史最高: <b id="final-highscore" style="color: #fbbf24;">0</b>
        </div>
        <button id="restart-game-btn" class="restart-btn">🎮 开启下一次游戏</button>
      </div>
    </div>
  </div>

  <script>
    const RAINBOW = [
      { name: '赤红', hex: '#ef4444', r: 239, g: 68, b: 68 },
      { name: '耀橙', hex: '#f97316', r: 249, g: 115, b: 22 },
      { name: '明黄', hex: '#eab308', r: 234, g: 179, b: 8 },
      { name: '翠绿', hex: '#22c55e', r: 34, g: 197, b: 94 },
      { name: '青碧', hex: '#06b6d4', r: 6, g: 182, b: 212 },
      { name: '湛蓝', hex: '#3b82f6', r: 59, g: 130, b: 246 },
      { name: '幻紫', hex: '#a855f7', r: 168, g: 85, b: 247 }
    ];

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const highscoreVal = document.getElementById('highscore-val');
    const colorDot = document.getElementById('color-dot');
    const colorText = document.getElementById('color-text');
    const statusOverlay = document.getElementById('status-overlay');
    const statusText = document.getElementById('status-text');
    const gameoverScreen = document.getElementById('gameover-screen');
    const finalScore = document.getElementById('final-score');
    const finalHighscore = document.getElementById('final-highscore');

    let score = 0;
    let highscore = parseInt(localStorage.getItem('gesture_snake_highscore') || '0', 10);
    highscoreVal.innerText = highscore;

    let isGameOver = false;
    let useMouseMode = false;
    let pointerPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let currentLength = 25;
    let snakeSegments = [];
    let invulnerableFrames = 80; // 保护帧，防止刚开局瞬间自撞
    let currentColor = { ...RAINBOW[3] };
    let targetColor = { ...RAINBOW[3] };
    let apple = { x: 0, y: 0, radius: 18, pulse: 0 };
    let particles = [];

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
      if (!apple.x) spawnApple();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnApple() {
      const margin = 80;
      apple.x = margin + Math.random() * (canvasElement.width - margin * 2);
      apple.y = margin + Math.random() * (canvasElement.height - margin * 2);
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 18; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 6;
        particles.push({
          x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
          radius: 3 + Math.random() * 3, alpha: 1, color
        });
      }
    }

    function restartGame() {
      score = 0;
      scoreVal.innerText = score;
      currentLength = 25;
      snakeSegments = [];
      particles = [];
      isGameOver = false;
      invulnerableFrames = 80;
      gameoverScreen.style.display = 'none';
      spawnApple();
    }

    function triggerGameOver() {
      if (isGameOver) return;
      isGameOver = true;
      if (score > highscore) {
        highscore = score;
        localStorage.setItem('gesture_snake_highscore', highscore);
        highscoreVal.innerText = highscore;
      }
      finalScore.innerText = score;
      finalHighscore.innerText = highscore;
      gameoverScreen.style.display = 'flex';
    }

    function updateSnake(tx, ty) {
      if (isGameOver) return;
      if (snakeSegments.length === 0) {
        for (let i = 0; i < currentLength; i++) snakeSegments.push({ x: tx, y: ty });
        return;
      }
      const head = snakeSegments[0];
      head.x += (tx - head.x) * 0.45;
      head.y += (ty - head.y) * 0.45;

      for (let i = 1; i < snakeSegments.length; i++) {
        const prev = snakeSegments[i - 1];
        const curr = snakeSegments[i];
        const dx = prev.x - curr.x;
        const dy = prev.y - curr.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0.001) {
          curr.x += dx * ((dist - 12) / dist);
          curr.y += dy * ((dist - 12) / dist);
        }
      }
      while (snakeSegments.length < currentLength) {
        const tail = snakeSegments[snakeSegments.length - 1];
        snakeSegments.push({ x: tail.x, y: tail.y });
      }

      // 仅在成长到足够长度且脱离保护期时检测碰撞
      if (invulnerableFrames > 0) {
        invulnerableFrames--;
      } else if (snakeSegments.length > 28) {
        for (let i = 16; i < snakeSegments.length; i++) {
          if (Math.hypot(head.x - snakeSegments[i].x, head.y - snakeSegments[i].y) < 14) {
            triggerGameOver();
            return;
          }
        }
      }
    }

    function render(img = null, finger = null) {
      const cw = canvasElement.width;
      const ch = canvasElement.height;
      canvasCtx.clearRect(0, 0, cw, ch);

      if (img && !useMouseMode) {
        canvasCtx.drawImage(img, 0, 0, cw, ch);
      } else {
        canvasCtx.fillStyle = '#090d16';
        canvasCtx.fillRect(0, 0, cw, ch);
      }

      currentColor.r += (targetColor.r - currentColor.r) * 0.08;
      currentColor.g += (targetColor.g - currentColor.g) * 0.08;
      currentColor.b += (targetColor.b - currentColor.b) * 0.08;

      const target = useMouseMode ? pointerPos : finger;
      if (target && !isGameOver) {
        updateSnake(target.x, target.y);
        if (Math.hypot(target.x - apple.x, target.y - apple.y) < apple.radius + 22) {
          score++;
          scoreVal.innerText = score;
          currentLength += 5;
          const next = RAINBOW[Math.floor(Math.random() * RAINBOW.length)];
          targetColor = { ...next };
          colorDot.style.background = next.hex;
          colorDot.style.color = next.hex;
          colorText.innerText = next.name;
          colorText.style.color = next.hex;
          createParticles(apple.x, apple.y, next.hex);
          spawnApple();
        }
      }

      if (!isGameOver) {
        apple.pulse += 0.08;
        const r = apple.radius + Math.sin(apple.pulse) * 3;
        canvasCtx.fillStyle = '#ef4444';
        canvasCtx.beginPath();
        canvasCtx.arc(apple.x, apple.y, r, 0, Math.PI * 2);
        canvasCtx.fill();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
        if (p.alpha <= 0) { particles.splice(i, 1); continue; }
        canvasCtx.globalAlpha = p.alpha;
        canvasCtx.fillStyle = p.color;
        canvasCtx.beginPath();
        canvasCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        canvasCtx.fill();
        canvasCtx.globalAlpha = 1;
      }

      if (snakeSegments.length > 1) {
        const cr = Math.round(currentColor.r);
        const cg = Math.round(currentColor.g);
        const cb = Math.round(currentColor.b);

        for (let i = snakeSegments.length - 1; i >= 0; i--) {
          const seg = snakeSegments[i];
          const radius = 17 * (1 - (i / snakeSegments.length) * 0.5);
          canvasCtx.fillStyle = `rgb(${cr}, ${cg}, ${cb})`;
          canvasCtx.beginPath();
          canvasCtx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
          canvasCtx.fill();
        }
      }
    }

    // 适配触屏与鼠标（考虑 scaleX(-1) 镜像坐标）
    function updatePointer(clientX, clientY) {
      pointerPos.x = window.innerWidth - clientX;
      pointerPos.y = clientY;
    }
    window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    function enableMouseMode() {
      useMouseMode = true;
      statusOverlay.style.display = 'none';
      function loop() {
        if (useMouseMode) render();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }

    document.getElementById('quick-mouse-btn').onclick = enableMouseMode;
    document.getElementById('toggle-mouse-btn').onclick = () => {
      useMouseMode = !useMouseMode;
      if (useMouseMode) enableMouseMode();
    };
    document.getElementById('reset-btn').onclick = restartGame;
    document.getElementById('restart-game-btn').onclick = restartGame;

    // 检查协议安全
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      statusText.innerHTML = `
        <b style="color:#ef4444;font-size:18px;">⚠️ 浏览器拦截了摄像头权限</b><br>
        当前是通过 <b>http://</b> 访问的。<br>
        现代浏览器规定：摄像头必须通过 <b>https://</b> 才能开启！<br>
        <small style="color:#94a3b8;margin-top:6px;display:block;">请为服务器配置 SSL 证书开启 HTTPS</small>
      `;
    }

    // 初始化 MediaPipe
    try {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      hands.onResults((res) => {
        statusOverlay.style.display = 'none';
        let tip = null;
        if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
          const p = res.multiHandLandmarks[0][8]; // 食指
          tip = { x: p.x * canvasElement.width, y: p.y * canvasElement.height };
        }
        render(res.image, tip);
      });

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          if (!useMouseMode) await hands.send({ image: videoElement });
        },
        facingMode: 'user', // 指定前置摄像头
        width: 1280,
        height: 720
      });

      camera.start().catch((err) => {
        console.warn(err);
        enableMouseMode();
      });
    } catch (e) {
      console.warn(e);
      enableMouseMode();
    }
  </script>
</body>
</html>
